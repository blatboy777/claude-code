<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go-план</title>
<meta name="description" content="Личный план изучения Go: задачи на день, дневник, трекер занятий">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300ADD8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='bold' font-size='15' fill='white' text-anchor='middle'%3EGo%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76; --line: #d8dee4;
  --accent: #00add8; --accent-strong: #007d9c; --accent-soft: #e3f6fb;
  --ok: #1a7f37; --ok-soft: #dafbe1; --warn: #9a6700; --warn-soft: #fff8c5;
  --heat0: #ebeef1; --heat1: #9be9f7; --heat2: #4fc9e6; --heat3: #00a3cc; --heat4: #006b87;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --line: #30363d;
    --accent: #2bc4ea; --accent-strong: #5fd6f2; --accent-soft: #0f2c36;
    --ok: #3fb950; --ok-soft: #12261b; --warn: #d29922; --warn-soft: #2b2312;
    --heat0: #21262d; --heat1: #0e4a5a; --heat2: #11708a; --heat3: #1b9fc2; --heat4: #5fd6f2;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
.brand { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 8px; }
.brand .logo { background: var(--accent); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 14px; }
.sync { font-size: 12px; color: var(--muted); text-align: right; }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; }
nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 20px 0 60px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 16px 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.bar { height: 8px; background: var(--heat0); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; cursor: pointer; }
.task label { flex: 1; cursor: pointer; }
.task.done label { color: var(--muted); text-decoration: line-through; }
.task .date { font-size: 12px; color: var(--muted); white-space: nowrap; }
.task.project label { font-weight: 600; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; vertical-align: 1px; }
.note { padding: 10px 12px; border-radius: 8px; border-left: 4px solid var(--accent); background: var(--accent-soft); margin: 12px 0; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.ok { border-color: var(--ok); background: var(--ok-soft); }
label.f { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
textarea, input[type=text], input[type=number], input[type=password], input[type=date], select {
  width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; }
textarea { min-height: 64px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }
@media (max-width: 480px) { .row > * { min-width: 100%; } }
button.btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn.danger { color: #cf222e; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.mood { display: flex; gap: 6px; }
.mood button { flex: 1; font-size: 20px; padding: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; }
.mood button.on { border-color: var(--accent); background: var(--accent-soft); }
.routine .task label small { color: var(--muted); }
.stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; cursor: pointer; }
.stage-head .pct { font-size: 13px; color: var(--muted); white-space: nowrap; }
.log { border-top: 1px solid var(--line); padding: 12px 0; }
.log:first-child { border-top: 0; }
.log .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.log p { margin: 4px 0; white-space: pre-wrap; }
.log p b { font-weight: 600; color: var(--muted); font-size: 13px; }
.heat { overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 3px; font-size: 11px; }
.heat td { width: 18px; height: 18px; border-radius: 3px; background: var(--heat0); padding: 0; }
.heat td.m { background: none; width: auto; padding-right: 6px; white-space: nowrap; color: var(--muted); }
.heat td.x { background: none; }
.heat td.today { outline: 2px solid var(--text); outline-offset: -1px; }
.heat td[data-d] { cursor: pointer; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.task a.go { font-size: 12px; white-space: nowrap; color: var(--accent-strong); text-decoration: none; margin-top: 2px; }
.q { padding: 10px 0; border-top: 1px solid var(--line); }
.qq { font-weight: 600; margin-bottom: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.right { background: var(--ok-soft); }
.opt.wrong { background: var(--warn-soft); text-decoration: line-through; }
.expl { font-size: 13px; color: var(--muted); margin: 4px 8px 0; }
.lrow { display: flex; justify-content: space-between; gap: 10px; padding: 8px 6px; border-top: 1px solid var(--line); color: var(--text); text-decoration: none; border-radius: 6px; }
.lrow:hover { background: var(--bg); }
.lrow.cur { font-weight: 600; background: var(--accent-soft); }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="logo">Go</span> Мой план</div>
      <div class="sync" id="syncStatus"></div>
    </div>
    <nav id="tabs">
      <button data-tab="today" class="active">Сегодня</button>
      <button data-tab="plan">План</button>
      <button data-tab="journal">Дневник</button>
      <button data-tab="tracker">Трекер</button>
      <button data-tab="review">Квартал</button>
      <button data-tab="settings">Настройки</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>

<script src="lessons.js"></script>
<script>
(function () {
'use strict';

// ---------------- Plan data ----------------
var GOAL_DATE = '2028-08-31';
var STAGES = [
  { title: 'Этап 0. SQL и основы мышления', start: '2026-11-24', end: '2027-01-31', hours: 200,
    goal: 'Уверенно писать SQL-запросы и понять, как вообще работает программирование.',
    check: 'Сам проектирую 3–4 связанные таблицы и без подсказок пишу запросы с JOIN, GROUP BY, HAVING.',
    tasks: [] },
  { title: 'Этап 1. Основы Go', start: '2027-02-01', end: '2027-05-31', hours: 400,
    goal: 'Писать простые программы на Go без подсказок.',
    check: 'Могу без интернета написать консольную программу со структурами, срезами и обработкой ошибок.',
    tasks: [
      'Установить Go (arm64) и VS Code с расширением Go',
      'Tour of Go (go.dev/tour) — пройти целиком',
      'Курс Яндекса «Основы Go»',
      'Go by Example — прорешать все примеры руками',
      'Типы, переменные, условия, циклы, функции',
      'Массивы, срезы (slices), мапы',
      'Структуры и методы',
      'Указатели',
      'Обработка ошибок (error, errors.Is / As)',
      'Пакеты и модули (go mod)',
      'Effective Go — прочитать',
      'Шпаргалка Go cheat sheet — держать под рукой',
      'Exercism: 30+ задач на Go',
      '!ПРОЕКТ: CLI-трекер задач с сохранением в файл'
    ] },
  { title: 'Этап 2. Go глубже и первые проекты', start: '2027-06-01', end: '2027-09-30', hours: 400,
    goal: 'Понять то, о чём спрашивают на собеседованиях по Go, и написать первый веб-сервис.',
    check: 'Объясняю, как работают горутины и каналы, и мой REST API работает с базой и покрыт тестами.',
    tasks: [
      'Интерфейсы (статья «Изучаем Golang: интерфейсы»)',
      'Горутины, каналы, select',
      'sync: Mutex, WaitGroup, Once',
      'Пакет context',
      'Тесты: пакет testing, табличные тесты',
      'Learn Go with Tests — пройти основную часть',
      'Стандартная библиотека: net/http, encoding/json, io, os, time',
      'Статья про Go JSON и неправильную типизацию в API',
      'database/sql и pgx, параметризованные запросы',
      'Дженерики (generics) — основы',
      'Git: ветки, коммиты, merge, pull request',
      '!ПРОЕКТ: REST API + PostgreSQL + тесты (например, сервис заметок)'
    ] },
  { title: 'Этап 3. Инструменты бэкенда', start: '2027-10-01', end: '2028-01-31', hours: 400,
    goal: 'Владеть инструментами, которые требуют в вакансиях.',
    check: 'Поднимаю свой проект одной командой docker-compose up, в нём есть кэш, очередь и CI.',
    tasks: [
      'Linux: терминал, файлы, процессы, права',
      'Docker и docker-compose (Docker Desktop или OrbStack на Mac)',
      'Миграции БД (goose или golang-migrate)',
      'Redis: кэширование',
      'Kafka или RabbitMQ — основы',
      'gRPC и protobuf',
      'Логирование и метрики (Prometheus)',
      'CI: GitHub Actions (тесты при каждом коммите)',
      'Статья «Чистая архитектура и как её готовить»',
      'Книга «100 Go Mistakes and How to Avoid Them»',
      'Выписать требования из 20 вакансий Go-junior на hh.ru',
      '!ПРОЕКТ: сервис в Docker с PostgreSQL, Redis и очередью'
    ] },
  { title: 'Этап 4. Витринный проект и подготовка', start: '2028-02-01', end: '2028-05-31', hours: 400,
    goal: 'Иметь проект, который не стыдно показать, и начать откликаться.',
    check: 'На GitHub 3+ проекта, резюме готово, прошёл первые собеседования.',
    tasks: [
      '!ПРОЕКТ-ВИТРИНА: продуманный сервис с деплоем на VPS',
      'README проекта: описание, схема, как запустить',
      'Алгоритмы: 50+ задач LeetCode (Easy / Medium)',
      'Сети: TCP/IP, HTTP, DNS — основы',
      'System design — основы',
      'Резюме + профиль на hh.ru + аккуратный GitHub',
      'Первые отклики на junior-вакансии (с февраля)',
      'Пробные собеседования (с Claude, с друзьями)'
    ] },
  { title: 'Этап 5. Финал: работа', start: '2028-06-01', end: '2028-08-31', hours: 300,
    goal: 'Получить оффер.',
    check: 'Я Go-разработчик.',
    tasks: [
      '10+ откликов в неделю',
      'После каждого собеседования — записать вопросы, на которые не ответил',
      'Повторять частые вопросы по Go, SQL и конкурентности',
      'Подготовиться к разговору о зарплате',
      '!ЦЕЛЬ: оффер 250–300 тыс. ₽'
    ] }
];
STAGES.forEach(function (s, si) {
  s.items = s.tasks.map(function (txt, ti) {
    var project = txt.charAt(0) === '!';
    return { id: 's' + si + 't' + ti, text: project ? txt.slice(1) : txt, project: project };
  });
});
var QUARTERS = ['2027-03', '2027-06', '2027-09', '2027-12', '2028-03', '2028-06', '2028-08'];
var MOODS = ['😫', '😕', '😐', '🙂', '🔥'];
var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
var WEEKDAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

// ---------------- Helpers ----------------
function pad(n) { return (n < 10 ? '0' : '') + n; }
function key(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); }
function todayKey() { return key(new Date()); }
function human(k) { var d = parse(k); return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()] + ' ' + d.getFullYear(); }
function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(sel) { return document.querySelector(sel); }
function plural(n, one, few, many) {
  var m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

// ---------------- State ----------------
var STORE = 'goPlan.v1';
var state = load();
function blank() { return { tasks: {}, logs: {}, reviews: {}, lessons: {}, settings: { restDay: -1 }, updatedAt: 0 }; }
function load() {
  try {
    var s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.tasks) { s.settings = s.settings || { restDay: -1 }; s.reviews = s.reviews || {}; s.logs = s.logs || {}; s.lessons = s.lessons || {}; return s; }
  } catch (e) {}
  return blank();
}
function save(silent) {
  state.updatedAt = Date.now();
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  if (!silent) schedulePush();
}
function cfg() {
  try { return JSON.parse(localStorage.getItem('goPlan.sync')) || {}; } catch (e) { return {}; }
}
function setCfg(c) { try { localStorage.setItem('goPlan.sync', JSON.stringify(c)); } catch (e) {} }

// ---------------- Derived ----------------
function stageProgress(s) {
  if (s === STAGES[0]) {
    var ld = LESSONS.filter(function (l) { return lessonState(l).done; }).length;
    return { done: ld, total: LESSONS.length, pct: Math.round(ld / LESSONS.length * 100) };
  }
  var done = s.items.filter(function (it) { return state.tasks[it.id]; }).length;
  return { done: done, total: s.items.length, pct: Math.round(done / s.items.length * 100) };
}
function calendarStage(k) {
  for (var i = 0; i < STAGES.length; i++) if (k <= STAGES[i].end) return i;
  return STAGES.length - 1;
}
function activeStage() {
  for (var i = 0; i < STAGES.length; i++) { var p = stageProgress(STAGES[i]); if (p.done < p.total) return i; }
  return STAGES.length - 1;
}
function stats() {
  var keys = Object.keys(state.logs).filter(function (k) { return state.logs[k].studied; }).sort();
  var hours = keys.reduce(function (a, k) { return a + (+state.logs[k].hours || 0); }, 0);
  var set = {}; keys.forEach(function (k) { set[k] = 1; });
  var restDay = +state.settings.restDay;
  // streak: consecutive studied days back from today (or yesterday); the rest day never breaks it
  var d = new Date(), streak = 0;
  if (!set[key(d)]) d.setDate(d.getDate() - 1);
  for (var guard = 0; guard < 1500; guard++) {
    var k = key(d);
    if (set[k]) streak++;
    else if (!(restDay >= 0 && d.getDay() === restDay)) break;
    d.setDate(d.getDate() - 1);
  }
  var best = 0, run = 0, prev = null;
  keys.forEach(function (k) {
    if (prev) {
      var gap = daysBetween(prev, k), ok = gap === 1;
      if (gap === 2 && restDay >= 0) { var mid = parse(prev); mid.setDate(mid.getDate() + 1); ok = mid.getDay() === restDay; }
      run = ok ? run + 1 : 1;
    } else run = 1;
    best = Math.max(best, run); prev = k;
  });
  return { days: keys.length, hours: hours, streak: streak, best: best };
}

// ---------------- Lessons ----------------
var PLACES = { w: ['🏢', 'на работе'], h: ['🏠', 'дома, на Mac'], a: ['📍', 'где угодно'] };
var SHORT = [
  'Перечитать конспект последнего урока (10 мин)',
  'Пройти мини-тест прошлого урока ещё раз — он открывается во вкладке «План» (5 мин)',
  'Решить 2–3 задачи на sql-ex.ru или pgexercises (15 мин)'
];
var PASS = 0.7;
var STAGE0_START = '2026-11-24';

function lessonState(l) { return state.lessons[l.id] || {}; }
function ensureLesson(l) {
  var st = state.lessons[l.id] = state.lessons[l.id] || {};
  st.tasks = st.tasks || {};
  return st;
}
function currentLesson() {
  for (var i = 0; i < LESSONS.length; i++) if (!lessonState(LESSONS[i]).done) return i;
  return LESSONS.length;
}
function quizPassed(l) {
  var q = lessonState(l).quiz;
  return !l.quiz.length || !!(q && q.answers && q.score / q.total >= PASS);
}
function lessonCounts(l) {
  var t = lessonState(l).tasks || {}, done = 0;
  l.tasks.forEach(function (x, j) { if (t[j]) done++; });
  var total = l.tasks.length;
  if (l.quiz.length) { total++; if (quizPassed(l)) done++; }
  return { done: done, total: total };
}
function lessonMinutes(l) { return l.tasks.reduce(function (a, t) { return a + (t[3] || 0); }, 0); }
function fmtMin(m) { return m < 60 ? m + ' мин' : String(Math.round(m / 30) / 2).replace('.', ',') + ' ч'; }
function markStudied() {
  var k = todayKey();
  var l = state.logs[k] = state.logs[k] || {};
  l.studied = true;
}
function bar(frac) { return '<div class="bar"><i style="width:' + Math.round(frac * 100) + '%"></i></div>'; }

// ---------------- Views ----------------
var tab = 'today';
var editDate = null;
var openLesson = null;

function render() {
  var v = $('#view');
  if (tab === 'today') v.innerHTML = viewToday();
  else if (tab === 'plan') v.innerHTML = viewPlan();
  else if (tab === 'journal') v.innerHTML = viewJournal();
  else if (tab === 'tracker') v.innerHTML = viewTracker();
  else if (tab === 'review') v.innerHTML = viewReview();
  else v.innerHTML = viewSettings();
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === tab); });
  renderSync();
}

function taskRow(it) {
  var done = state.tasks[it.id];
  return '<div class="task' + (done ? ' done' : '') + (it.project ? ' project' : '') + '">' +
    '<input type="checkbox" id="c_' + it.id + '" data-task="' + it.id + '"' + (done ? ' checked' : '') + '>' +
    '<label for="c_' + it.id + '">' + (it.project ? '<span class="tag">проект</span> ' : '') + esc(it.text) + '</label>' +
    (done ? '<span class="date">' + human(done) + '</span>' : '') + '</div>';
}

function statsBlock() {
  var st = stats(), left = Math.max(0, daysBetween(todayKey(), GOAL_DATE));
  return '<div class="stats">' +
    '<div class="stat"><b>' + st.streak + '</b><span>' + plural(st.streak, 'день', 'дня', 'дней') + ' подряд</span></div>' +

function quizHtml(i) {

  var h = '<h3>Мини-тест</h3><p class="small muted">Засчитывается от 70% правильных ответов.</p>';
  l.quiz.forEach(function (qq, n) {
    var right = checked && q.answers[n] === qq[2];
    h += '<div class="q"><div class="qq">' + (n + 1) + '. ' + esc(qq[0]) + '</div>';
    qq[1].forEach(function (opt, o) {
      var cls = '';
      if (checked) { if (o === qq[2]) cls = ' right'; else if (q.answers[n] === o) cls = ' wrong'; }
      h += '<label class="opt' + cls + '"><input type="radio" name="q' + i + '_' + n + '" value="' + o + '"' +
        (checked && q.answers[n] === o ? ' checked' : '') + (checked ? ' disabled' : '') + '> ' + esc(opt) + '</label>';
    });
    if (checked) h += '<div class="expl">' + (right ? '✓ Верно. ' : '✗ Правильный ответ выделен зелёным. ') + esc(qq[3] || '') + '</div>';
    h += '</div>';
  });
  if (checked) {
    var ok = q.score / q.total >= PASS;
    h += '<div class="note ' + (ok ? 'ok' : 'warn') + '">' + (ok ? 'Тест сдан: ' : 'Пока не сдан: ') + q.score + ' из ' + q.total +

      '<div class="btns"><button class="btn" data-act="quiz-retry" data-l="' + i + '">Пройти заново</button></div>';
  } else {
    h += '<div class="btns"><button class="btn primary" data-act="quiz-check" data-l="' + i + '">Проверить ответы</button></div>';

  return h;
}

function lessonCard(i) {

    bar(c.done / c.total) + '<p class="small muted">' + c.done + ' из ' + c.total + ' пунктов · 🏢 на работе · 🏠 дома · 📍 где угодно</p>';
  l.tasks.forEach(function (task, j) {
    var on = t[j], id = 'lt' + i + '_' + j, p = PLACES[task[0]] || PLACES.a;
    h += '<div class="task' + (on ? ' done' : '') + '"><input type="checkbox" id="' + id + '" data-lt="' + i + ':' + j + '"' + (on ? ' checked' : '') + '>' +

function scheduleNote(ci) {
  var k = todayKey(), end = STAGES[0].end;
  if (ci >= LESSONS.length || k < STAGE0_START) return '';
  var frac = Math.min(1, daysBetween(STAGE0_START, k) / daysBetween(STAGE0_START, end));
  var expected = Math.round(frac * LESSONS.length);
  var diff = ci - expected;
  if (diff <= -3) return '<div class="note warn small">По графику сейчас должен идти урок ' + Math.min(expected + 1, LESSONS.length) + ', вы на уроке ' + (ci + 1) + '. Это нормально — просто продолжайте. Если отставание растёт, пересмотрите сроки в квартальной проверке.</div>';
  if (diff >= 3) return '<div class="note ok small">Вы опережаете график на ' + diff + ' ' + plural(diff, 'урок', 'урока', 'уроков') + '. Отлично!</div>';
  return '<p class="small muted">Идёте по графику: этап 0 до ' + human(end) + '.</p>';
}

function heatLevel(l) { var hrs = +l.hours || 0; if (l.short || !hrs) return 1; return hrs < 2 ? 1 : hrs < 3 ? 2 : hrs < 4 ? 3 : 4; }
function viewTracker() {

  var m = new Date(2026, 10, 1), end = new Date(2028, 7, 1);
  while (m <= end) {
    var y = m.getFullYear(), mo = m.getMonth(), dim = new Date(y, mo + 1, 0).getDate();

  h += '</table></div><div class="legend">меньше <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> больше часов</div></div>';
  return h;
}

// ---------------- Events ----------------
document.getElementById('tabs').addEventListener('click', function (e) {
  var t = e.target.getAttribute('data-tab');
  if (t) { tab = t; editDate = null; openLesson = null; render(); window.scrollTo(0, 0); }
});

function collectDay() {
  var k = editDate || todayKey();
  var l = state.logs[k] = state.logs[k] || {};
  ['hours', 'did', 'learned', 'hard'].forEach(function (f) { var el = $('#f_' + f); if (el) l[f] = el.value; });
  return l;
}
function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }

var view = $('#view');
view.addEventListener('change', function (e) {
  var t = e.target;
  if (t.getAttribute('data-lt')) {
    var p = t.getAttribute('data-lt').split(':'), l = LESSONS[+p[0]], st = ensureLesson(l);
    if (t.checked) { st.tasks[p[1]] = todayKey(); markStudied(); } else delete st.tasks[p[1]];
    collectDay(); save(); keepScroll(render);
  } else if (t.getAttribute('data-short')) {
    var log = collectDay(); log.shortTasks = log.shortTasks || {};
    log.shortTasks[t.getAttribute('data-short')] = t.checked;
    if (SHORT.every(function (x, j) { return log.shortTasks[j]; })) log.studied = true;
    save(); keepScroll(render);
  } else if (t.getAttribute('data-task')) {
    var id = t.getAttribute('data-task');
    if (t.checked) { state.tasks[id] = todayKey(); markStudied(); } else delete state.tasks[id];
    save(); keepScroll(render);
  } else if (t.id === 'restDay') {
    state.settings.restDay = +t.value; save();
  } else if (t.id === 'importFile' && t.files[0]) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result); if (!d.tasks) throw 0;
        d.lessons = d.lessons || {}; d.logs = d.logs || {}; d.reviews = d.reviews || {}; d.settings = d.settings || { restDay: -1 };
        state = d; save(); alert('Данные загружены'); render();
      } catch (err) { alert('Не удалось прочитать файл'); }
    };
    r.readAsText(t.files[0]);
  }
});
view.addEventListener('input', function (e) {
  var t = e.target;
  if (t.getAttribute('data-review')) {
    var q = t.getAttribute('data-review');
    state.reviews[q] = state.reviews[q] || {};
    state.reviews[q][t.getAttribute('data-field')] = t.value;
    save();
  } else if (t.id && t.id.indexOf('f_') === 0) {
    collectDay(); save(); // autosave drafts
  }
});
view.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act],[data-mood],[data-open],[data-d],[data-toggle],[data-lesson]') : null;
  if (!t) return;
  if (t.getAttribute('data-mood')) {
    collectDay().mood = +t.getAttribute('data-mood'); save(); keepScroll(render); return;
  }
  if (t.getAttribute('data-open') || t.getAttribute('data-d')) {
    e.preventDefault(); editDate = t.getAttribute('data-open') || t.getAttribute('data-d');
    if (editDate === todayKey()) editDate = null;
    tab = 'today'; render(); window.scrollTo(0, 0); return;
  }
  if (t.getAttribute('data-lesson')) {
    e.preventDefault(); openLesson = +t.getAttribute('data-lesson'); render(); window.scrollTo(0, 0); return;
  }
  if (t.getAttribute('data-toggle')) { $('#' + t.getAttribute('data-toggle')).classList.toggle('hidden'); return; }
  var act = t.getAttribute('data-act'), li = +t.getAttribute('data-l');
  if (act === 'back-today') { e.preventDefault(); editDate = null; render(); }
  else if (act === 'plan-back') { e.preventDefault(); openLesson = null; render(); }
  else if (act === 'quiz-check') {
    var l = LESSONS[li], answers = [], missing = false;
    l.quiz.forEach(function (qq, n) {
      var el = document.querySelector('input[name="q' + li + '_' + n + '"]:checked');
      if (!el) missing = true; else answers.push(+el.value);
    });
    if (missing) { alert('Ответьте на все вопросы'); return; }
    var score = answers.filter(function (a, n) { return a === l.quiz[n][2]; }).length;
    ensureLesson(l).quiz = { answers: answers, score: score, total: l.quiz.length, at: todayKey() };
    markStudied(); collectDay(); save(); keepScroll(render);
  } else if (act === 'quiz-retry') {
    delete ensureLesson(LESSONS[li]).quiz; collectDay(); save(); keepScroll(render);
  } else if (act === 'lesson-done') {
    ensureLesson(LESSONS[li]).done = todayKey(); markStudied(); collectDay(); save();
    openLesson = null; render(); window.scrollTo(0, 0);
  } else if (act === 'short-on') {
    collectDay().short = true; save(); render(); window.scrollTo(0, 0);
  } else if (act === 'short-off') {
    collectDay().short = false; save(); render();
  } else if (act === 'save-day') {
    var lg = collectDay(); lg.studied = true; save(); keepScroll(render);
    var m = $('#saveMsg'); if (m) m.textContent = 'Сохранено ✓ День отмечен в трекере.';
  } else if (act === 'unmark-day') { collectDay().studied = false; save(); keepScroll(render); }
  else if (act === 'export') {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'go-plan-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  } else if (act === 'reset') {
    if (confirm('Стереть все отметки и заметки на этом устройстве? Сначала лучше скачать копию.')) { state = blank(); save(true); render(); }
  } else if (act === 'sync-save') {
    setCfg({ token: $('#g_token').value.trim(), gist: $('#g_id').value.trim() }); syncMsg('Настройки сохранены'); pull(true);
  } else if (act === 'sync-create') { createGist(); }
  else if (act === 'sync-pull') { pull(false); }
  else if (act === 'sync-push') { push(); }
  else if (act === 'sync-forget') { setCfg({}); render(); syncMsg('Токен удалён с этого устройства'); }
});

// ---------------- Gist sync ----------------
var FILE = 'go-plan.json', pushTimer = null, syncText = '';
function syncMsg(s) { var el = $('#syncMsg'); if (el) el.textContent = s; }
function setSync(s) { syncText = s; renderSync(); }
function renderSync() {
  var c = cfg();
  $('#syncStatus').textContent = c.token && c.gist ? (syncText || 'синхронизация включена') : 'только это устройство';
}
function api(method, path, body) {
  var c = cfg();
  return fetch('https://api.github.com' + path, {
    method: method,
    headers: { 'Authorization': 'Bearer ' + c.token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    if (!r.ok) throw new Error(r.status === 401 ? 'неверный токен' : r.status === 404 ? 'гист не найден или нет доступа' : 'ошибка ' + r.status);
    return r.json();
  });
}
function createGist() {
  var tok = $('#g_token').value.trim();
  if (!tok) { syncMsg('Сначала вставьте токен'); return; }
  setCfg({ token: tok });
  var files = {}; files[FILE] = { content: JSON.stringify(state) };
  api('POST', '/gists', { description: 'Go-план: данные', public: false, files: files }).then(function (g) {
    setCfg({ token: tok, gist: g.id }); render(); syncMsg('Готово. ID гиста: ' + g.id + ' — скопируйте его на другие устройства.'); setSync('синхронизировано');
  }).catch(function (e) { syncMsg('Не получилось: ' + e.message); });
}
function pull(auto) {
  var c = cfg(); if (!c.token || !c.gist) { if (!auto) syncMsg('Синхронизация не настроена'); return Promise.resolve(); }
  setSync('загрузка…');
  return api('GET', '/gists/' + c.gist).then(function (g) {
    var f = g.files[FILE];
    var remote = f && f.content ? JSON.parse(f.content) : null;
    if (remote && remote.tasks && (!auto || (remote.updatedAt || 0) > (state.updatedAt || 0))) {
      state = remote; save(true); render(); setSync('синхронизировано'); if (!auto) syncMsg('Данные загружены из облака');
    } else if (auto && (state.updatedAt || 0) > ((remote && remote.updatedAt) || 0)) {
      push();
    } else setSync('синхронизировано');
  }).catch(function (e) { setSync('ошибка синхронизации'); syncMsg('Ошибка: ' + e.message); });
}
function push() {
  var c = cfg(); if (!c.token || !c.gist) return;
  setSync('сохранение…');
  var files = {}; files[FILE] = { content: JSON.stringify(state) };
  api('PATCH', '/gists/' + c.gist, { files: files }).then(function () { setSync('синхронизировано'); syncMsg('Отправлено в облако'); })
    .catch(function (e) { setSync('ошибка синхронизации'); syncMsg('Ошибка: ' + e.message); });
}
function schedulePush() {
  var c = cfg(); if (!c.token || !c.gist) return;
  setSync('есть несохранённые изменения');
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 2500);
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && pushTimer) { clearTimeout(pushTimer); pushTimer = null; push(); }
  else if (document.visibilityState === 'visible') pull(true).then(function () { if (tab === 'today') render(); });
});

render();
pull(true);
})();
</script>
